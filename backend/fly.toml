# fly.toml app configuration file generated for ai-voice-agent-api on 2025-12-14T12:51:12-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-voice-agent-api'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENV = 'production'
  PORT = '8080'
  AUTO_SEED = 'false'  # Disable auto-seeding in production to speed up startup

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'  # Suspend instead of stop for faster restarts
  auto_start_machines = true
  min_machines_running = 1  # Keep at least 1 machine running to avoid cold starts
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'  # Give app time for DB connection and migrations
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpus = 1
